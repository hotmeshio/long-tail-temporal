# Self-hosted Long Tail + Temporal on one machine. Nothing calls out.
# One Postgres server, three databases: longtail (Long Tail), temporal and temporal_visibility (Temporal).
# docker compose up -d --build (scripts/pack-long-tail.sh tests an unreleased long-tail build)
# Start a review: docker compose exec worker npx tsx examples/review-order/start-workflow.ts order-1
# then resolve it at http://localhost:3200

x-temporal-db: &temporal-db
  DB: postgres12
  DB_PORT: 5432
  POSTGRES_USER: postgres
  POSTGRES_PWD: password
  SQL_PASSWORD: password
  POSTGRES_SEEDS: postgres

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: longtail
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${PG_PORT:-5426}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 30

  temporal-schema:
    image: temporalio/admin-tools:1.32.2
    depends_on:
      postgres:
        condition: service_healthy
    environment: *temporal-db
    volumes:
      - ./docker/temporal:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/setup-postgres.sh"]

  temporal:
    image: temporalio/server:1.32.2
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    environment:
      <<: *temporal-db
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    volumes:
      - ./docker/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    ports:
      - "7233:7233"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 60

  temporal-namespace:
    image: temporalio/admin-tools:1.32.2
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      DEFAULT_NAMESPACE: default
    volumes:
      - ./docker/temporal:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/create-namespace.sh"]

  temporal-ui:
    image: temporalio/ui:2.58.1
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3200
    ports:
      - "8080:8080"

  long-tail:
    build:
      context: .
      target: runtime
    depends_on:
      postgres:
        condition: service_healthy
      temporal-namespace:
        condition: service_completed_successfully
    environment:
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
      TEMPORAL_NAMESPACE: default
      TEMPORAL_UI_URL: ${TEMPORAL_UI_URL:-http://localhost:8080}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: longtail
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-change-me-local-only}
      LT_ADMIN_USER: superadmin
      LT_ADMIN_PASSWORD: ${LT_ADMIN_PASSWORD:-l0ngt@1l}
      LT_ROLES: reviewer
      # Registers reviewOrderRequest, so the Invoke Tool and the invoke API can start it.
      LT_START_CONFIG: /config/long-tail.json
    volumes:
      - ./examples/review-order/long-tail.json:/config/long-tail.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${LT_PORT:-3200}:3000"

  worker:
    build:
      context: .
      target: example
    depends_on:
      long-tail:
        condition: service_started
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      LT_URL: http://long-tail:3000
      LT_API_KEY: ${LT_API_KEY:-}
      # Local demo: with no LT_API_KEY, the worker signs in as the admin and mints a bot key.
      LT_ADMIN_USER: superadmin
      LT_ADMIN_PASSWORD: ${LT_ADMIN_PASSWORD:-l0ngt@1l}

volumes:
  pgdata:
