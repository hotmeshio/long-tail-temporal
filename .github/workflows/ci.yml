name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    name: Typecheck, unit, integration, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PG_PORT: 5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build

  smoke:
    name: Review on the compose stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - name: Wait for Long Tail and the worker
        run: |
          for i in $(seq 1 120); do
            curl -sf http://localhost:3200/health >/dev/null \
              && docker compose logs worker 2>&1 | grep -q "state: 'RUNNING'" && exit 0
            sleep 2
          done
          exit 1
      - run: ./scripts/smoke.sh
      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color --tail 300
      - if: always()
        run: docker compose down -v
